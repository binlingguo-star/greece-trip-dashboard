<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>希腊旅行控制台</title>
  <style>
    :root { --ink:#152033; --muted:#667085; --line:#ead8b8; --paper:#fffaf2; --blue:#2457a6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:linear-gradient(160deg,#e7f5ff 0%,#fff8ea 55%,#f2dfbd 100%); }
    .gate { width:min(420px,100%); background:rgba(255,250,242,.94); border:1px solid var(--line); border-radius:28px; padding:24px; box-shadow:0 24px 70px rgba(23,50,79,.16); }
    .eyebrow { color:var(--blue); font-size:12px; font-weight:900; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:8px 0 8px; font-size:28px; line-height:1.08; }
    p { margin:0 0 18px; color:var(--muted); line-height:1.65; font-size:14px; }
    label { display:block; font-size:13px; font-weight:900; margin-bottom:8px; }
    input { width:100%; border:1px solid #d8c7a8; background:#fffdfa; border-radius:16px; padding:15px 14px; font-size:17px; outline:none; }
    input:focus { border-color:var(--blue); box-shadow:0 0 0 4px rgba(36,87,166,.12); }
    button { width:100%; margin-top:12px; border:0; border-radius:16px; padding:15px 16px; background:var(--blue); color:white; font-weight:950; font-size:16px; }
    .hint { margin-top:12px; font-size:12px; color:var(--muted); line-height:1.55; }
    .error { min-height:20px; margin-top:10px; color:#b42318; font-size:13px; font-weight:800; }
  </style>
</head>
<body>
  <main class="gate">
    <div class="eyebrow">Private Trip Console</div>
    <h1>希腊旅行控制台</h1>
    <p>请输入访问密码。内容会在本地浏览器内解密后显示。</p>
    <form id="unlock">
      <label for="password">访问密码</label>
      <input id="password" type="password" autocomplete="current-password" inputmode="numeric" pattern="[0-9]*" autofocus>
      <button type="submit">进入行程</button>
      <div id="error" class="error"></div>
    </form>
    <div class="hint">提示：这是静态网页的轻量保护，请只把链接和密码发给信任的人。</div>
  </main>
